name: LiquidFiles Offline Manager - Build APK from ZIP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidfiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate source and compile debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          EXTRACT_DIR="$RUNNER_TEMP/liquidfiles-project"
          PROJECT_DIR=""

          # If a complete Android project was committed directly, build it as-is.
          if [[ -s "$ROOT/gradlew" && ( -s "$ROOT/settings.gradle" || -s "$ROOT/settings.gradle.kts" ) ]]; then
            PROJECT_DIR="$ROOT"
          else
            ZIP_FILE="$ROOT/LiquidFiles_Offline_Manager_PERMANENT_FIX_UPDATED.zip"
            if [[ ! -s "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find "$ROOT" -maxdepth 2 -type f -iname '*.zip' -not -path '*/.git/*' | sort | head -n 1 || true)"
            fi
            if [[ -z "$ZIP_FILE" || ! -s "$ZIP_FILE" ]]; then
              echo '::error::No project ZIP found. Upload LiquidFiles_Offline_Manager_PERMANENT_FIX_UPDATED.zip to the repository root.'
              find "$ROOT" -maxdepth 3 -type f -not -path '*/.git/*' | sort | head -100
              exit 1
            fi

            echo "Using project archive: $(basename "$ZIP_FILE")"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            while IFS= read -r -d '' WRAPPER; do
              CANDIDATE="$(dirname "$WRAPPER")"
              if [[ -s "$CANDIDATE/gradle/wrapper/gradle-wrapper.jar" && ( -s "$CANDIDATE/settings.gradle" || -s "$CANDIDATE/settings.gradle.kts" ) ]]; then
                PROJECT_DIR="$CANDIDATE"
                break
              fi
            done < <(find "$EXTRACT_DIR" -type f -name gradlew -print0)
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error::The ZIP does not contain a valid Gradle Android project (gradlew, settings file, and wrapper JAR required).'
            find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -150
            exit 1
          fi

          echo "Project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Python for structural smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run project smoke tests and validate Android XML
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python tools/project_smoke_test.py
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *(root / 'res').rglob('*.xml')]
          files = [path for path in files if path.is_file()]
          if not files:
              raise SystemExit('No Android XML files found')
          for path in files:
              ET.parse(path)
              print(f'OK: {path}')
          print(f'Validated {len(files)} Android XML files')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Compile debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-Offline-Manager-debug-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          
