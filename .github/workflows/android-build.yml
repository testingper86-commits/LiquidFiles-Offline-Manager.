name: LiquidFiles Offline Manager - Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidfiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract project and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository (contains the project ZIP)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate and extract Android project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo 'Repository files:'
          find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -150

          ZIP_FILE=''
          for candidate in \
            './LiquidFiles_Offline_Manager_PERMANENT_FIX_UPDATED.zip' \
            './LiquidFiles_Offline_Manager_PERMANENT_FIX.zip' \
            './LiquidFiles_Offline_Manager_PERMANENT_FIX_VERIFIED.zip'; do
            if [[ -s "$candidate" ]]; then ZIP_FILE="$candidate"; break; fi
          done
          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | sort | head -1 || true)"
          fi
          if [[ -z "$ZIP_FILE" || ! -s "$ZIP_FILE" ]]; then
            echo '::error::No Android project ZIP found in repository root. Upload LiquidFiles_Offline_Manager_PERMANENT_FIX_UPDATED.zip.'
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          EXTRACT_DIR="$RUNNER_TEMP/liquidfiles-project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          python - "$ZIP_FILE" "$EXTRACT_DIR" <<'PYTHON'
          import sys, zipfile
          archive, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              zf.extractall(destination)
          print(f'Archive integrity OK: {archive}')
          PYTHON

          PROJECT_DIR=''
          while IFS= read -r -d '' wrapper; do
            candidate="$(dirname "$wrapper")"
            if [[ -s "$candidate/settings.gradle" || -s "$candidate/settings.gradle.kts" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name gradlew -print0)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error::ZIP did not contain a Gradle project (gradlew plus settings.gradle[.kts]).'
            find "$EXTRACT_DIR" -maxdepth 6 -type f | sort | head -200
            exit 1
          fi
          echo "Project root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run project smoke tests and validate Android XML
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f tools/project_smoke_test.py ]]; then
            python tools/project_smoke_test.py
          else
            echo '::error::tools/project_smoke_test.py is missing from the extracted project.'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *(root / 'res').rglob('*.xml')]
          files = [p for p in files if p.is_file()]
          if not files:
              raise SystemExit('No Android XML files found under app/src/main')
          for path in files:
              ET.parse(path)
              print(f'XML OK: {path}')
          print(f'Validated {len(files)} Android XML files')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Gradle caching is intentionally disabled because the Gradle project
          # is extracted into the runner temp directory, not checked-out workspace.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate Gradle wrapper
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Compile debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-Offline-Manager-debug-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          
