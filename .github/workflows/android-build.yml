name: Android Build & Checks

on:
push:
branches: [main]
pull_request:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check source ZIP
    shell: bash
    run: |
      set -euo pipefail
      ZIP="LiquidFiles_Offline_Manager_Updated_Source.zip"
      if [[ ! -f "$ZIP" ]]; then
        echo "::error::Missing $ZIP in repository root."
        exit 1
      fi
      unzip -t "$ZIP"

  - name: Extract and locate Android project
    shell: bash
    run: |
      set -euo pipefail
      SRC="$RUNNER_TEMP/liquidfiles-source"
      mkdir -p "$SRC"
      unzip -q LiquidFiles_Offline_Manager_Updated_Source.zip -d "$SRC"

      PROJECT=""
      while IFS= read -r -d '' WRAPPER; do
        DIR="$(dirname "$WRAPPER")"
        if { [[ -f "$DIR/settings.gradle" ]] || [[ -f "$DIR/settings.gradle.kts" ]]; } \
          && { [[ -f "$DIR/app/build.gradle" ]] || [[ -f "$DIR/app/build.gradle.kts" ]]; }; then
          PROJECT="$DIR"
          break
        fi
      done < <(find "$SRC" -type f -name gradlew -print0)

      if [[ -z "$PROJECT" ]]; then
        echo "::error::No Gradle Android project found in ZIP."
        find "$SRC" -maxdepth 5 -type f -print | head -300
        exit 1
      fi

      chmod +x "$PROJECT/gradlew"
      echo "ANDROID_PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Validate manifest
    shell: bash
    run: |
      set -euo pipefail
      FILE="$ANDROID_PROJECT_DIR/app/src/main/AndroidManifest.xml"
      if [[ ! -f "$FILE" ]]; then
        echo "::error::AndroidManifest.xml is missing."
        exit 1
      fi
      python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1]); print("Manifest XML is valid")' "$FILE"

  - name: Build debug APK
    shell: bash
    working-directory: ${{ env.ANDROID_PROJECT_DIR }}
    run: ./gradlew --no-daemon --stacktrace assembleDebug

  - name: Collect APK
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p "$GITHUB_WORKSPACE/apk"
      find "$ANDROID_PROJECT_DIR" -type f \
        -path '*/build/outputs/apk/debug/*.apk' \
        -exec cp {} "$GITHUB_WORKSPACE/apk/" \;

      if ! compgen -G "$GITHUB_WORKSPACE/apk/*.apk" > /dev/null; then
        echo "::error::No debug APK was produced."
        exit 1
      fi
      ls -lh "$GITHUB_WORKSPACE/apk"

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: LiquidFiles-debug-APK
      path: apk/*.apk
      if-no-files-found: error
      retention-days: 7
