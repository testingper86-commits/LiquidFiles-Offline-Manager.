name: Liquid Files - Build Android APK from Source ZIP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidfiles-zip-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate source ZIP and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Discover the source archive instead of hardcoding its filename.
      # This prevents failures caused by suffixes such as _FIXED.
      - name: Find and verify source ZIP
        id: source_zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          if [[ "${#ZIP_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one source ZIP in the repository root; found ${#ZIP_FILES[@]}."
            printf 'ZIP found: %s\n' "${ZIP_FILES[@]:-none}"
            exit 1
          fi
          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Using source archive: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract and locate Android project
        id: project
        shell: bash
        env:
          ZIP_FILE: ${{ steps.source_zip.outputs.zip_file }}
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/liquidfiles-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
          PROJECT_DIR=""
          while IFS= read -r -d '' WRAPPER; do
            CANDIDATE="$(dirname "$WRAPPER")"
            if { [[ -s "$CANDIDATE/settings.gradle" ]] || [[ -s "$CANDIDATE/settings.gradle.kts" ]]; } \
              && { [[ -s "$CANDIDATE/app/build.gradle" ]] || [[ -s "$CANDIDATE/app/build.gradle.kts" ]]; } \
              && [[ -s "$CANDIDATE/gradle/wrapper/gradle-wrapper.jar" ]] \
              && [[ -s "$CANDIDATE/gradle/wrapper/gradle-wrapper.properties" ]]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name gradlew -print0)
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::No complete Android Gradle project was found inside the ZIP."
            find "$EXTRACT_DIR" -maxdepth 6 -type f -print | sort | head -300
            exit 1
          fi
          chmod +x "$PROJECT_DIR/gradlew"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project located at: $PROJECT_DIR"

      - name: Set up Python for source checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run project smoke tests
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -f "$PROJECT_DIR/tools/project_smoke_test.py" ]]; then
            python "$PROJECT_DIR/tools/project_smoke_test.py"
          else
            echo "::error::tools/project_smoke_test.py is missing from the source ZIP."
            exit 1
          fi

      - name: Validate Android XML files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          python - "$PROJECT_DIR" <<'PYCODE'
          import pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1]) / 'app' / 'src' / 'main'
          files = [root / 'AndroidManifest.xml', *(root / 'res').rglob('*.xml')]
          files = [p for p in files if p.is_file()]
          if not files:
              raise SystemExit('No Android XML files found')
          for path in files:
              ET.parse(path)
              print(f'OK: {path}')
          print(f'Validated {len(files)} Android XML files')
          PYCODE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
