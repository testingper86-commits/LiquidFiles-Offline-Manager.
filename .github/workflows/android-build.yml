name: Android Build & Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source and manifest smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Locate project source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "LiquidFiles_Offline_Manager_Updated_YML_Build_Package.zip" ]; then
            unzip -q "LiquidFiles_Offline_Manager_Updated_YML_Build_Package.zip" -d .
          fi
          if [ -f "tools/project_smoke_test.py" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "liquidfiles_build_package/liquid_dev/tools/project_smoke_test.py" ]; then
            echo "PROJECT_DIR=liquidfiles_build_package/liquid_dev" >> "$GITHUB_ENV"
          elif [ -f "liquid_dev/tools/project_smoke_test.py" ]; then
            echo "PROJECT_DIR=liquid_dev" >> "$GITHUB_ENV"
          else
            echo "Cannot locate project source or tools/project_smoke_test.py" >&2
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project smoke tests
        shell: bash
        run: cd "$PROJECT_DIR" && python tools/project_smoke_test.py
      - name: Parse Android XML resources and manifest
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *(root / 'res').rglob('*.xml')]
          files = [path for path in files if path.is_file()]
          if not files:
              raise SystemExit('No Android XML files found')
          for path in files:
              ET.parse(path)
              print(f'OK: {path}')
          print(f'Validated {len(files)} XML files')
          PY

  android-build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    needs: source-checks
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Locate project source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "LiquidFiles_Offline_Manager_Updated_YML_Build_Package.zip" ]; then
            unzip -q "LiquidFiles_Offline_Manager_Updated_YML_Build_Package.zip" -d .
          fi
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "liquidfiles_build_package/liquid_dev/gradlew" ]; then
            echo "PROJECT_DIR=liquidfiles_build_package/liquid_dev" >> "$GITHUB_ENV"
          elif [ -f "liquid_dev/gradlew" ]; then
            echo "PROJECT_DIR=liquid_dev" >> "$GITHUB_ENV"
          else
            echo "Cannot locate Gradle wrapper" >&2
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Compile debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/dist/"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
