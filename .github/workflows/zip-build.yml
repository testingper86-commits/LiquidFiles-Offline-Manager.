name: Liquid Files - Build Android APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidfiles-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract project ZIP and build debug APK
    # Pinned on purpose: ubuntu-latest started moving to Ubuntu 26 on Oct 19, 2026,
    # which can break the Android SDK setup action.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository (contains the ZIP)
        uses: actions/checkout@v4

      - name: Locate and extract Android project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          echo 'Files in repository:'
          find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -100

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | sort | head -1)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo '::error::No .zip file found in the repository. Commit the Android project ZIP.'
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/liquidfiles-extracted"
          rm -rf "$EXTRACT_DIR" && mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          # Project root = folder that has gradlew AND a settings file.
          PROJECT_DIR=''
          while IFS= read -r -d '' WRAPPER; do
            CANDIDATE="$(dirname "$WRAPPER")"
            if [[ -s "$CANDIDATE/settings.gradle" || -s "$CANDIDATE/settings.gradle.kts" ]]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name gradlew -print0)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error::No Gradle project root (gradlew + settings.gradle[.kts]) found inside the ZIP.'
            find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          for REQUIRED in \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"; do
            if [[ ! -s "$REQUIRED" ]]; then
              echo "::error::Missing required file in ZIP: $REQUIRED"
              exit 1
            fi
          done

          # Accept Groovy or Kotlin DSL for the app module.
          if ! ls "$PROJECT_DIR"/app/build.gradle* >/dev/null 2>&1; then
            echo '::error::app/build.gradle(.kts) not found in the ZIP.'
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      # No Gradle cache option here: the project lives in the ZIP, not in the
      # checkout, so setup-java's cache scan would fail.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run project smoke tests (if included)
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -f "$PROJECT_DIR/tools/project_smoke_test.py" ]]; then
            cd "$PROJECT_DIR"
            python3 tools/project_smoke_test.py
          else
            echo 'No smoke-test script in project; skipping.'
          fi

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            ${{ steps.extract.outputs.project_dir }}/app/build/reports
            ${{ steps.extract.outputs.project_dir }}/build/reports
          if-no-files-found: ignore
          retention-days: 7
