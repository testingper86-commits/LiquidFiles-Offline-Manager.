name: Android Build & Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source and manifest smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project smoke tests
        run: python tools/project_smoke_test.py
      - name: Parse Android XML resources and manifest
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('app/src/main')
          files = [root / 'AndroidManifest.xml', * (root / 'res').rglob('*.xml')]
          files = [path for path in files if path.is_file()]
          if not files:
              raise SystemExit('No Android XML files found')
          for path in files:
              ET.parse(path)
              print(f'OK: {path}')
          print(f'Validated {len(files)} XML files')
          PY

  android-build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    needs: source-checks
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Explicitly disable the action's default SDK package list: it may request
      # the retired package "tools", which makes sdkmanager exit with code 1.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        run: |
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
