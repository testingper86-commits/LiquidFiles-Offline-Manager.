name: Liquid Files - Build from uploaded ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository containing the ZIP
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'LiquidFiles_Offline_Manager_Fresh_Repo.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No project ZIP found in repository root or one folder below.'
            echo 'Upload the project ZIP, then commit it.'
            exit 1
          fi
          echo "Using project archive: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/liquidfiles-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/liquidfiles-project"
          PROJECT_DIR="$(find "$RUNNER_TEMP/liquidfiles-project" -type f -name gradlew -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: ZIP extracted, but no gradlew was found. The archive may not contain an Android Gradle project.'
            find "$RUNNER_TEMP/liquidfiles-project" -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          test -s "$PROJECT_DIR/settings.gradle" -o -s "$PROJECT_DIR/settings.gradle.kts"
          test -s "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -s "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run project smoke tests when available
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/tools/project_smoke_test.py" ]; then
            python3 "$PROJECT_DIR/tools/project_smoke_test.py"
          else
            echo 'No project smoke-test script found; continuing with Gradle build.'
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
