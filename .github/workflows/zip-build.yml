name: Liquid Files - Build Android APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidfiles-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract project ZIP and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZIP repository
        uses: actions/checkout@v4

      # IMPORTANT: Do not enable setup-java's Gradle cache here. It scans the
      # checked-out repository for Gradle files before the ZIP has been extracted.
      - name: Locate and extract Android project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          echo 'Files currently in repository:'
          find . -maxdepth 3 -type f -print | sort | head -200

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo 'ERROR: No .zip file was found in the repository (searched root and 2 subfolder levels).'
            echo 'Upload the Android project ZIP to the repository and commit it.'
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          EXTRACT_DIR="$RUNNER_TEMP/liquidfiles-extracted"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          # Locate the actual project root by its Gradle wrapper and settings file.
          PROJECT_DIR=''
          while IFS= read -r -d '' WRAPPER; do
            CANDIDATE="$(dirname "$WRAPPER")"
            if [[ -s "$CANDIDATE/settings.gradle" || -s "$CANDIDATE/settings.gradle.kts" ]]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name gradlew -print0)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo 'ERROR: No valid Gradle project root found in the ZIP.'
            echo 'Expected gradlew and settings.gradle or settings.gradle.kts in the same project directory.'
            echo 'Archive file listing:'
            find "$EXTRACT_DIR" -maxdepth 5 -type f -print | sort | head -250
            exit 1
          fi

          for REQUIRED in \
            "$PROJECT_DIR/gradlew" \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" \
            "$PROJECT_DIR/app/build.gradle.kts"; do
            if [[ ! -s "$REQUIRED" ]]; then
              echo "ERROR: Required Android/Gradle file is missing: $REQUIRED"
              exit 1
            fi
          done

          chmod +x "$PROJECT_DIR/gradlew"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root verified: $PROJECT_DIR"
          echo 'Gradle files found:'
          find "$PROJECT_DIR" -maxdepth 3 \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradle-wrapper.properties' \) -type f -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Intentionally no cache: gradle. The source project lives inside the ZIP,
          # not in the repository checkout, and setup-java cache scanning fails otherwise.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Run project smoke tests when available
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -f "$PROJECT_DIR/tools/project_smoke_test.py" ]]; then
            python3 "$PROJECT_DIR/tools/project_smoke_test.py"
          else
            echo 'No project smoke-test script included; skipping this optional check.'
          fi

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
